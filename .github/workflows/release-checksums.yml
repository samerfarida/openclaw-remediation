# On tag push (v*), compute SHA-256 of scripts, create GitHub Release, and attach checksums + scripts
name: Release checksums

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create release and upload assets

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Checksums
        run: |
          sha256sum scripts/uninstall_macos_linux.sh scripts/uninstall_windows.ps1 > checksums.txt
          cat checksums.txt

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            checksums.txt
            VERSION
            scripts/uninstall_macos_linux.sh
            scripts/uninstall_windows.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
